services:
  - type: web
    name: hogwarts-manager
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --prefix client && npm run build --prefix client && npm install --include=dev --prefix server && npm run build --prefix server
    startCommand: npm run start --prefix server
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Persistent database (e.g. a Turso libSQL database: "libsql://your-db.turso.io").
      # Without this, data lives on Render's local disk and is wiped on every
      # deploy/restart. Set the real values in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
